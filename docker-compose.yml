name: weedpanel

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weedpanel}
      POSTGRES_USER: ${POSTGRES_USER:-weedpanel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: 8081
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-weedpanel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-weedpanel}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/app/weedpanel", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["127.0.0.1:${HTTP_PORT:-18080}:80"]
    depends_on:
      backend: {condition: service_healthy}
    networks: [internal, caddy]

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
  caddy:
    external: true
    name: separ-deploy_web
